<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle Badge -->
  <circle cx="250" cy="250" r="200" fill="#1C1C1F" />

  <!-- Top horizontal accent line above left stem -->
  <rect x="102" y="156" width="66" height="8" fill="#FFFFFF" />

  <!-- Main Monogram Shapes (W L A) -->
  <g fill="#FFFFFF">
    <!-- Left vertical stem dropping down -->
    <rect x="118" y="174" width="34" height="226" />
    
    <!-- W Left Diagonal -->
    <polygon points="118,174 172,174 206,320 170,320" />
    
    <!-- W Middle Diagonal -->
    <polygon points="172,174 240,174 206,320 170,320" />
    
    <!-- W Right / A Left Diagonal -->
    <polygon points="240,174 292,174 212,320 172,320" />

    <!-- A Right Stem and horizontal extension -->
    <polygon points="240,174 344,174 448,320 448,352 386,352 370,320 284,320 284,288 336,288 318,252 270,252" />
    
    <!-- A Inner Triangle cutout fill back with circle color -->
    <!-- (We draw inner shape in #1C1C1F) -->
  </g>

  <!-- Correct cutout overlay in circle color -->
  <g fill="#1C1C1F">
    <!-- V cutout between W left and middle -->
    <polygon points="152,174 206,320 172,174" />
    <!-- V cutout between W middle and A left -->
    <polygon points="240,174 206,320 270,174" />
    <!-- A inner triangle cutout -->
    <polygon points="292,234 326,290 274,290" />
  </g>

  <!-- Typography under monogram -->
  <text x="278" y="364" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="2.2" text-anchor="middle">WONDERLIGHT ADVENTURE</text>
  <text x="278" y="388" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="13" letter-spacing="6.5" text-anchor="middle">COMPANY</text>
</svg>
